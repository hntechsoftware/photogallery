<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Gallery</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent: #5c67f2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #gallery-container {
            text-align: center;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }

        .photo-frame {
            width: 100%;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease-in-out;
        }

        #caption {
            margin: 15px 0;
            font-weight: 600;
            color: var(--text-color);
            text-transform: capitalize;
            min-height: 1.2em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="gallery-container">
    <div class="photo-frame">
        <img id="display-photo" src="" alt="Gallery Image" style="opacity: 0;">
    </div>
    <div id="caption">Loading...</div>
    
    <div class="controls">
        <button onclick="changePhoto(-1)">Prev</button>
        <button onclick="changePhoto(1)">Next</button>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const USERNAME = 'hntechsoftware';
    const REPO = 'photogallery';
    const FOLDER_PATH = 'WallpaperCollection'; // e.g., 'images' or leave empty for root
    const INTERVAL = 5000; 
    // ---------------------

    let images = [];
    let currentIndex = 0;
    let autoCycle;

    async function fetchGallery() {
        const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            images = data.filter(file => /\.(jpe?g|png|gif|webp)$/i.test(file.name));

            if (images.length > 0) {
                render();
                startTimer();
            } else {
                document.getElementById('caption').innerText = "No images found.";
            }
        } catch (e) {
            document.getElementById('caption').innerText = "Error loading files.";
        }
    }

    function render() {
        const img = document.getElementById('display-photo');
        const cap = document.getElementById('caption');
        const photo = images[currentIndex];

        img.style.opacity = 0;
        setTimeout(() => {
            img.src = photo.download_url;
            cap.innerText = photo.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            img.style.opacity = 1;
        }, 300);
    }

    function changePhoto(step) {
        currentIndex = (currentIndex + step + images.length) % images.length;
        render();
        resetTimer(); // Reset auto-slide when user interacts
    }

    function startTimer() {
        autoCycle = setInterval(() => changePhoto(1), INTERVAL);
    }

    function resetTimer() {
        clearInterval(autoCycle);
        startTimer();
    }

    fetchGallery();
</script>

</body>
</html>
