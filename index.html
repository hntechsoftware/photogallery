<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The HNTech Gallery</title>
    <style>
        /* --- RAW BRUTALIST CSS --- */
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #ffffff;
            color: #000;
            margin: 40px auto;
            max-width: 900px;
            padding: 0 20px;
            line-height: 1.2;
        }

        header {
            border-bottom: 3px solid #000;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 2rem; text-transform: uppercase; }
        p.subheading { margin: 5px 0 0 0; color: #666; font-size: 0.9rem; }

        section-label {
            display: block;
            background: #000;
            color: #fff;
            padding: 2px 8px;
            font-size: 0.8rem;
            width: fit-content;
            margin-bottom: 10px;
        }

        /* Thumbnail Grid */
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 5px;
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 40px;
            max-height: 180px;
            overflow-y: scroll;
        }

        /* Brutalist Scrollbar */
        #grid::-webkit-scrollbar { width: 10px; }
        #grid::-webkit-scrollbar-track { background: #eee; }
        #grid::-webkit-scrollbar-thumb { background: #000; border: 2px solid #eee; }

        .thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            filter: grayscale(100%);
            border: 1px solid #eee;
        }

        .thumb:hover, .thumb.active {
            filter: grayscale(0%);
            border: 1px solid #000;
            outline: 1px solid #000;
        }

        /* Large Display Area */
        #viewer {
            border: 1px solid #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
        }

        #main-img {
            max-width: 100%;
            max-height: 70vh;
            border: 1px solid #000;
            display: none;
        }

        #meta-container {
            width: 100%;
            margin-top: 15px;
            display: grid;
            grid-template-columns: 100px 1fr 150px; /* Counter | Caption | Download */
            align-items: center;
            border-top: 1px dashed #000;
            padding-top: 10px;
        }

        #counter { font-weight: bold; color: #666; }
        #caption { font-weight: bold; text-transform: uppercase; text-align: center; }
        .download-wrapper { text-align: right; }

        .btn-download {
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 5px 12px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .btn-download:hover { background: #444; }
        .status { font-style: italic; }
    </style>
</head>
<body>

    <header style="text-align:center;">
        <h1>The HNTech Gallery</h1>
        <p class="subheading">Collection of my favorite photography shots.<br>Shots from Pakistan, Azerbaijan, Germany, Italy, Dubai, Jordan and more :)</p>
    </header>

    <section-label>INDEX</section-label>
    <div id="grid"><span class="status">connecting_to_server...</span></div>

    <section-label>PREVIEW_WINDOW</section-label>
    <div id="viewer">
        <img id="main-img" src="" alt="">
        
        <div id="meta-container" style="display: none;">
            <div id="counter">[ 00 / 00 ]</div>
            <div id="caption">FILE_NAME</div>
            <div class="download-wrapper">
                <a id="download-link" href="#" download class="btn-download">DOWNLOAD</a>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const USER = 'hntechsoftware';
    const REPO = 'photogallery';
    const DIR  = 'WallpaperCollection'; 

    const grid = document.getElementById('grid');
    const mainImg = document.getElementById('main-img');
    const caption = document.getElementById('caption');
    const meta = document.getElementById('meta-container');
    const dlLink = document.getElementById('download-link');
    const counter = document.getElementById('counter');

    let images = [];

    async function init() {
        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${DIR}`);
            const files = await res.json();
            images = files.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name));

            if (images.length === 0) {
                grid.innerHTML = "STATUS: NO_FILES_FOUND";
                return;
            }

            grid.innerHTML = ''; 

            images.forEach((img, index) => {
                const el = document.createElement('img');
                el.src = img.download_url;
                el.className = 'thumb';
                el.onclick = () => select(index, el);
                grid.appendChild(el);

                if (index === 0) select(index, el);
            });

        } catch (e) {
            grid.innerHTML = "STATUS: CONNECTION_ERROR";
        }
    }

    function select(index, element) {
        const imgObj = images[index];
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        
        mainImg.src = imgObj.download_url;
        mainImg.style.display = 'block';
        meta.style.display = 'grid';
        
        // Update Metadata
        caption.innerText = imgObj.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        counter.innerText = `[${(index + 1).toString().padStart(2, '0')} / ${images.length.toString().padStart(2, '0')}]`;
        
        dlLink.href = imgObj.download_url;
        element.classList.add('active');
    }

    init();
</script>

</body>
</html>
